<!DOCTYPE html>
<html lang="ru" data-user="mark" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>GymNote — Марк и Лера</title>
  <meta name="description" content="Удобный iOS-трекер для зала: прогрессия весов, подходы и тренажёры для Марка и Леры." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="GymNote" />
  <meta name="theme-color" content="#F2F2F7" id="meta-theme-color" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
  <link rel="stylesheet" href="./styles.css?v=25" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Floating Rest Timer (0px when idle) -->
    <div id="timer-container" class="timer-floating-host"></div>

    <!-- Main Screen View -->
    <main class="main-content" id="main-content"></main>

    <!-- Bottom iOS Tab Bar (5 slots: thumb-zone ergonomics) -->
    <nav class="tab-bar" aria-label="Навигация">
      <button type="button" class="tab-btn active" data-tab="workout" id="tab-workout">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 9.5v5m11-5v5M4 10.5v3m16-3v3M6.5 12h11"/>
        </svg>
        <span>Тренировка</span>
      </button>
      <button type="button" class="tab-btn" data-tab="progression" id="tab-progression">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17l5-5 4 3 7-8m0 0h-4m4 0v4"/>
        </svg>
        <span>Прогресс</span>
      </button>
      <button type="button" class="tab-add-btn" id="btn-quick-add" aria-label="Добавить упражнение" title="Добавить упражнение или тренажёр">
        <span class="tab-add-pill">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </span>
      </button>
      <button type="button" class="tab-btn" data-tab="catalog" id="tab-catalog">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="4" rx="1.5"/>
          <rect x="3" y="10" width="18" height="4" rx="1.5"/>
          <rect x="3" y="16" width="12" height="4" rx="1.5"/>
        </svg>
        <span>Тренажёры</span>
      </button>
      <button type="button" class="tab-btn tab-profile-btn" id="btn-open-settings" aria-label="Профиль, облако и настройки" title="Профиль и настройки">
        <span class="tab-avatar" id="tab-profile-avatar">
          <span id="tab-profile-initial">М</span>
          <span class="sync-dot" id="sync-dot"></span>
        </span>
        <span id="tab-profile-label">Марк</span>
      </button>
    </nav>
  </div>

  <!-- iOS Bottom Sheet Backdrop -->
  <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true">
    <div class="sheet" id="sheet-content" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./exercises-db.js?v=25"></script>
  <script src="./telegram-sync.js?v=25"></script>
  <script src="./app.js?v=25"></script>
</body>
</html>
